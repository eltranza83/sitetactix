name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Security Audit, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Blocks on high/critical issues in the libraries that ship in the app
      - name: Security Audit Gate (App Libraries, High / Critical)
        run: npm audit --omit=dev --audit-level=high

      # Developer-only tools (e.g. firebase-tools) never ship to phones; report only
      - name: Security Audit Report (Developer Tools)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Code Quality & Lint
        run: npm run lint

      - name: Automated Test Suite
        run: npm test

      - name: Firestore Security Rules Emulator Tests
        run: npm run test:rules

      - name: Production Build
        run: npm run build

