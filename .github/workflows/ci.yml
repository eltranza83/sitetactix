name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Security Audit, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit Gate (High / Critical)
        run: npm audit --audit-level=high

      - name: Code Quality & Lint
        run: npm run lint

      - name: Automated Test Suite
        run: npm test

      - name: Firestore Security Rules Emulator Tests
        run: npm run test:rules

      - name: Production Build
        run: npm run build

